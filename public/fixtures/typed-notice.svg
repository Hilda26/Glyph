  <text x="480" y="130" text-anchor="middle" font-family="Georgia,serif" font-size="44" fill="#191714">NOTICE TO HARBOR CARRIERS</text>
  <text x="140" y="212" font-family="Courier New,monospace" font-size="28" fill="#191714">Port office circular 17. Public record.</text>
  <text x="140" y="274" font-family="Courier New,monospace" font-size="28" fill="#191714">North gate opens at six bells.</text>
  <text x="140" y="336" font-family="Courier New,monospace" font-size="28" fill="#191714">Lamp oil: twelve tins received.</text>
  <text x="140" y="398" font-family="Courier New,monospace" font-size="28" fill="#191714">Clerk: Mara Vell, ledger mark B-41.</text>
  <text x="140" y="460" font-family="Courier New,monospace" font-size="28" fill="#191714">Filed for municipal archive, 1908.</text>
