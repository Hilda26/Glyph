name: glyphwork-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  deterministic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run check:network
      - run: npm run contracts:compile
      - run: npm run contracts:preflight
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

